<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>วันนี้กินอะไรดี? สุ่มเมนูอาหาร</title>
<meta name="description" content="กดปุ่มเดียว สุ่มเมนูอาหารมื้อนี้ให้ เพิ่มหรือลบเมนูได้เอง">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #4a2208;
    --ink-soft: #8a5a36;
    --card: #fffaf3;
    --line: #f6d9b8;
    --orange: #ff7a1a;
    --orange-deep: #e85d04;
    --sun: #ffc247;
    --radius: 28px;
    --font-display: "Mitr", "Noto Sans Thai", system-ui, sans-serif;
    --font-body: "Noto Sans Thai", "Sarabun", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: var(--font-body);
    color: var(--ink);
    background: linear-gradient(160deg, #ffd27a 0%, #ff9d3c 45%, #f2620f 100%) fixed;
    line-height: 1.6;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 28px 16px 56px;
    display: grid;
    gap: 18px;
  }
  h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(2rem, 8vw, 2.9rem);
    line-height: 1.2;
    margin: 8px 0 0;
    text-align: center;
    color: #fff;
    text-shadow: 0 3px 0 rgba(150, 50, 0, .35);
  }
  .tagline {
    margin: 0;
    text-align: center;
    color: #fff3e0;
    font-weight: 500;
  }
  .card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 22px;
    box-shadow: 0 14px 30px -12px rgba(120, 40, 0, .45);
  }
  h2 {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.25rem;
    margin: 0 0 12px;
  }

  /* ---------- picker ---------- */
  .stage {
    text-align: center;
  }
  .plate {
    width: min(260px, 70vw);
    aspect-ratio: 1;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #fff4e2 55%, #ffe2bd 100%);
    border: 8px solid var(--sun);
    display: grid;
    place-content: center;
    gap: 2px;
    box-shadow: inset 0 -8px 0 rgba(255, 150, 40, .25), 0 8px 0 rgba(232, 93, 4, .25);
  }
  .plate .emoji {
    font-size: clamp(3.6rem, 18vw, 5rem);
    line-height: 1.1;
  }
  .plate .name {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(1.3rem, 6vw, 1.7rem);
    padding: 0 14px;
    word-break: break-word;
  }
  .plate.spinning .emoji { animation: wobble .18s ease-in-out infinite alternate; }
  .plate.landed { animation: pop .6s cubic-bezier(.2, 1.6, .4, 1); border-color: var(--orange); }
  @keyframes wobble { from { transform: rotate(-8deg) scale(.96); } to { transform: rotate(8deg) scale(1.06); } }
  @keyframes pop { 0% { transform: scale(.85); } 100% { transform: scale(1); } }

  .status {
    min-height: 1.6em;
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .status strong { color: var(--orange-deep); }

  button { font-family: inherit; cursor: pointer; }
  .go {
    width: 100%;
    border: 0;
    border-radius: 999px;
    padding: 16px 24px;
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 1.35rem;
    color: #fff;
    background: linear-gradient(180deg, #ff9a3c, var(--orange-deep));
    box-shadow: 0 6px 0 #b8430a, 0 14px 22px -8px rgba(150, 50, 0, .6);
    transition: transform .08s, box-shadow .08s;
  }
  .go:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 #b8430a; }
  .go:disabled { opacity: .7; cursor: progress; }

  /* ---------- form ---------- */
  form { display: grid; grid-template-columns: 64px 1fr; gap: 10px; }
  label.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input[type="text"] {
    width: 100%;
    font: inherit;
    padding: 12px 14px;
    border-radius: 16px;
    border: 2px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  input.emoji-in { text-align: center; font-size: 1.4rem; padding: 8px; }
  input::placeholder { color: #c49a76; }
  .add {
    grid-column: 1 / -1;
    border: 0;
    border-radius: 999px;
    padding: 12px 20px;
    font-weight: 600;
    font-size: 1rem;
    color: var(--ink);
    background: var(--sun);
    box-shadow: 0 4px 0 #d9971a;
  }
  .add:active { transform: translateY(3px); box-shadow: 0 1px 0 #d9971a; }
  .msg { grid-column: 1 / -1; margin: 0; min-height: 1.4em; font-size: .92rem; color: var(--orange-deep); }

  /* ---------- list ---------- */
  .list-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  .list-head h2 { margin: 0; }
  .reset {
    border: 2px solid var(--line);
    background: transparent;
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font-size: .88rem;
    font-weight: 500;
  }
  .chips { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 999px;
    padding: 4px 6px 4px 12px;
    font-size: .95rem;
  }
  .chip button {
    border: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #ffe6cc;
    color: var(--orange-deep);
    font-size: 1.1rem;
    line-height: 1;
    display: grid;
    place-content: center;
  }
  .chip button:hover { background: var(--orange); color: #fff; }
  .empty { color: var(--ink-soft); margin: 0; }

  :focus-visible { outline: 3px solid #3b1a00; outline-offset: 3px; }
  footer { text-align: center; color: #fff3e0; font-size: .85rem; }

  @media (prefers-reduced-motion: reduce) {
    .plate.spinning .emoji, .plate.landed { animation: none; }
    .go { transition: none; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>วันนี้กินอะไรดี? 🍽️</h1>
    <p class="tagline">เลิกคิดไม่ออก ให้โชคชะตาเลือกให้</p>
  </header>

  <section class="card stage" aria-labelledby="pick-title">
    <h2 id="pick-title" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">สุ่มเมนู</h2>
    <div class="plate" id="plate" aria-live="polite">
      <div class="emoji" id="emoji">🍽️</div>
      <div class="name" id="name">หิวแล้วใช่ไหม?</div>
    </div>
    <p class="status" id="status">กดปุ่มด้านล่างเพื่อสุ่มเมนู</p>
    <button class="go" id="go" type="button">สุ่มเลย!</button>
  </section>

  <section class="card" aria-labelledby="add-title">
    <h2 id="add-title">เพิ่มเมนูของคุณ</h2>
    <form id="form" autocomplete="off">
      <label class="sr" for="emojiIn">อีโมจิ</label>
      <input type="text" id="emojiIn" class="emoji-in" placeholder="🍜" maxlength="4" inputmode="text">
      <label class="sr" for="nameIn">ชื่อเมนู</label>
      <input type="text" id="nameIn" placeholder="เช่น ข้าวไข่เจียวหมูสับ" maxlength="40">
      <button class="add" type="submit">เพิ่มเมนู</button>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </section>

  <section class="card" aria-labelledby="list-title">
    <div class="list-head">
      <h2 id="list-title">เมนูทั้งหมด (<span id="count">0</span>)</h2>
      <button class="reset" id="reset" type="button">คืนค่าเริ่มต้น</button>
    </div>
    <ul class="chips" id="chips"></ul>
  </section>

  <footer>กดกากบาทที่เมนูเพื่อลบออกจากรายการสุ่ม</footer>
</main>

<script>
(function () {
  var STORE_KEY = "thai-food-picker-v1";
  var DEFAULTS = [
    ["🍳", "ข้าวกะเพราไข่ดาว"], ["🍜", "ก๋วยเตี๋ยวเรือ"], ["🍝", "ผัดซีอิ๊ว"],
    ["🍛", "ข้าวมันไก่"], ["🥗", "ส้มตำ ไก่ย่าง"], ["🍲", "ต้มยำกุ้ง"],
    ["🍛", "แกงเขียวหวานไก่"], ["🍝", "ผัดไทย"], ["🍚", "ข้าวผัดปู"],
    ["🥘", "ข้าวหมูกรอบ"], ["🍢", "หมูปิ้งข้าวเหนียว"], ["🍜", "บะหมี่เกี๊ยวหมูแดง"],
    ["🍚", "ข้าวขาหมู"], ["🥢", "ลาบหมู"], ["🍲", "หมูกระทะ"],
    ["🍚", "ข้าวหน้าเป็ด"], ["🍛", "ข้าวคลุกกะปิ"], ["🍜", "ก๋วยจั๊บ"]
  ].map(function (d) { return { emoji: d[0], name: d[1] }; });

  var $ = function (id) { return document.getElementById(id); };
  var plate = $("plate"), emojiEl = $("emoji"), nameEl = $("name"),
      statusEl = $("status"), goBtn = $("go"), chips = $("chips"),
      countEl = $("count"), msg = $("msg"), form = $("form");

  var dishes = load();
  var last = -1, busy = false;
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function load() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
    } catch (e) {}
    return DEFAULTS.slice();
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(dishes)); } catch (e) {}
  }

  function render() {
    chips.innerHTML = "";
    if (!dishes.length) {
      var li = document.createElement("li");
      li.className = "empty";
      li.textContent = "ยังไม่มีเมนู เพิ่มเมนูแรกด้านบนได้เลย";
      chips.appendChild(li);
    }
    dishes.forEach(function (d, i) {
      var li = document.createElement("li");
      li.className = "chip";
      var label = document.createElement("span");
      label.textContent = d.emoji + " " + d.name;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "×";
      btn.setAttribute("aria-label", "ลบ " + d.name);
      btn.addEventListener("click", function () { removeDish(i); });
      li.appendChild(label);
      li.appendChild(btn);
      chips.appendChild(li);
    });
    countEl.textContent = dishes.length;
    goBtn.disabled = busy || dishes.length === 0;
  }

  function show(d) {
    emojiEl.textContent = d.emoji;
    nameEl.textContent = d.name;
  }

  function pickIndex() {
    if (dishes.length === 1) return 0;
    var i;
    do { i = Math.floor(Math.random() * dishes.length); } while (i === last);
    return i;
  }

  function spin() {
    if (busy || !dishes.length) return;
    busy = true;
    goBtn.disabled = true;
    goBtn.textContent = "กำลังสุ่ม...";
    plate.classList.remove("landed");
    plate.classList.add("spinning");
    statusEl.textContent = "ลุ้นๆๆ...";

    var target = pickIndex();
    var steps = reduceMotion ? 1 : 22 + Math.floor(Math.random() * 6);
    var n = 0, shown = Math.floor(Math.random() * dishes.length);

    (function tick() {
      n++;
      if (n >= steps) {
        last = target;
        show(dishes[target]);
        finish(dishes[target]);
        return;
      }
      // never show the same dish twice in a row while spinning
      if (dishes.length > 1) {
        var next;
        do { next = Math.floor(Math.random() * dishes.length); } while (next === shown);
        shown = next;
      }
      show(dishes[shown]);
      // starts fast (60ms), slows to ~420ms near the end
      var t = n / steps;
      var delay = 60 + Math.pow(t, 3) * 360;
      setTimeout(tick, delay);
    })();
  }

  function finish(d) {
    plate.classList.remove("spinning");
    void plate.offsetWidth; // restart the pop animation
    plate.classList.add("landed");
    statusEl.innerHTML = "มื้อนี้กิน <strong></strong> นะ!";
    statusEl.querySelector("strong").textContent = d.name;
    busy = false;
    goBtn.textContent = "สุ่มใหม่";
    goBtn.disabled = false;
  }

  function removeDish(i) {
    if (busy) return;
    dishes.splice(i, 1);
    last = -1;
    save();
    render();
  }

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var name = $("nameIn").value.trim();
    var emoji = $("emojiIn").value.trim() || "🍴";
    if (!name) { msg.textContent = "กรุณาใส่ชื่อเมนูก่อนนะ"; $("nameIn").focus(); return; }
    var dup = dishes.some(function (d) { return d.name === name; });
    if (dup) { msg.textContent = "มีเมนู “" + name + "” อยู่แล้ว"; return; }
    if (busy) { msg.textContent = "รอให้สุ่มเสร็จก่อนนะ"; return; }
    dishes.push({ emoji: emoji, name: name });
    last = -1;
    save();
    render();
    msg.textContent = "เพิ่ม “" + name + "” แล้ว";
    $("nameIn").value = "";
    $("emojiIn").value = "";
    $("nameIn").focus();
  });

  $("reset").addEventListener("click", function () {
    if (busy) return;
    if (!confirm("คืนค่ารายการเมนูเป็นค่าเริ่มต้น? เมนูที่เพิ่มเองจะหายไป")) return;
    dishes = DEFAULTS.slice();
    last = -1;
    save();
    render();
    msg.textContent = "";
  });

  goBtn.addEventListener("click", spin);
  render();
})();
</script>
</body>
</html>
